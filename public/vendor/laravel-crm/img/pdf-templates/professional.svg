    <rect x="150" y="214" width="16" height="3" rx="1" fill="#2b2b2b" />
    <rect x="188" y="214" width="30" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="222" x2="220" y2="222" stroke="#eeeeee" stroke-width="1" />
    <rect x="20" y="228" width="86" height="3" rx="1" fill="#2b2b2b" />
