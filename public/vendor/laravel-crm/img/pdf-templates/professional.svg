    <rect x="160" y="22" width="60" height="12" rx="2" fill="#7a7a7a" />
    <rect x="170" y="40" width="50" height="4" rx="1" fill="#2b2b2b" />

    <!-- Stacked meta rows with thin underlines -->
    <rect x="20" y="66" width="60" height="3" rx="1" fill="#7a7a7a" />
    <rect x="180" y="66" width="40" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="76" x2="220" y2="76" stroke="#d9d9d9" stroke-width="1" />
    <rect x="20" y="82" width="60" height="3" rx="1" fill="#7a7a7a" />
    <rect x="180" y="82" width="40" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="92" x2="220" y2="92" stroke="#d9d9d9" stroke-width="1" />
    <rect x="20" y="98" width="60" height="3" rx="1" fill="#7a7a7a" />
    <rect x="180" y="98" width="40" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="108" x2="220" y2="108" stroke="#d9d9d9" stroke-width="1" />

    <!-- Parties block with thin border top/bottom + vertical divider -->
    <line x1="20" y1="122" x2="220" y2="122" stroke="#d9d9d9" stroke-width="1" />
    <line x1="120" y1="122" x2="120" y2="164" stroke="#d9d9d9" stroke-width="1" />
    <rect x="26" y="130" width="28" height="3" rx="1" fill="#7a7a7a" />
    <rect x="26" y="140" width="76" height="3" rx="1" fill="#2b2b2b" />
    <rect x="26" y="148" width="60" height="3" rx="1" fill="#2b2b2b" />
    <rect x="26" y="156" width="52" height="3" rx="1" fill="#2b2b2b" />
    <rect x="132" y="130" width="30" height="3" rx="1" fill="#7a7a7a" />
    <rect x="132" y="140" width="72" height="3" rx="1" fill="#2b2b2b" />
    <rect x="132" y="148" width="58" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="170" x2="220" y2="170" stroke="#d9d9d9" stroke-width="1" />

    <!-- Items table header (thin bottom border) -->
    <rect x="20" y="184" width="24" height="3" rx="1" fill="#2b2b2b" />
    <rect x="112" y="184" width="20" height="3" rx="1" fill="#2b2b2b" />
    <rect x="150" y="184" width="20" height="3" rx="1" fill="#2b2b2b" />
    <rect x="188" y="184" width="30" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="192" x2="220" y2="192" stroke="#2b2b2b" stroke-width="1" />

