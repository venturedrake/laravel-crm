    <rect x="150" y="228" width="16" height="3" rx="1" fill="#2b2b2b" />
    <rect x="188" y="228" width="30" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="236" x2="220" y2="236" stroke="#eeeeee" stroke-width="1" />

    <!-- Totals stack right-aligned with thin underlines -->
    <rect x="140" y="250" width="40" height="3" rx="1" fill="#7a7a7a" />
    <rect x="190" y="250" width="30" height="3" rx="1" fill="#2b2b2b" />
    <line x1="138" y1="258" x2="220" y2="258" stroke="#d9d9d9" stroke-width="1" />
    <rect x="140" y="264" width="30" height="3" rx="1" fill="#7a7a7a" />
    <rect x="190" y="264" width="30" height="3" rx="1" fill="#2b2b2b" />
    <line x1="138" y1="272" x2="220" y2="272" stroke="#d9d9d9" stroke-width="1" />
    <line x1="138" y1="280" x2="220" y2="280" stroke="#2b2b2b" stroke-width="2" />
    <rect x="140" y="286" width="26" height="4" rx="1" fill="#2b2b2b" />
    <rect x="190" y="286" width="30" height="4" rx="1" fill="#2b2b2b" />
</svg>
