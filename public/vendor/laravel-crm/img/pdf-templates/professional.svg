<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Professional PDF template preview">
    <!-- Page background -->
    <rect x="0" y="0" width="240" height="320" fill="#ffffff" stroke="#d9d9d9" stroke-width="1" rx="4" />

    <!-- Large title top-left / small brand top-right -->
