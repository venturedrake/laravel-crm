    <rect x="20" y="200" width="80" height="3" rx="1" fill="#2b2b2b" />
    <rect x="112" y="200" width="22" height="3" rx="1" fill="#2b2b2b" />
    <rect x="150" y="200" width="16" height="3" rx="1" fill="#2b2b2b" />
    <rect x="188" y="200" width="30" height="3" rx="1" fill="#2b2b2b" />
    <line x1="20" y1="208" x2="220" y2="208" stroke="#eeeeee" stroke-width="1" />
    <rect x="20" y="214" width="72" height="3" rx="1" fill="#2b2b2b" />
