<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Compact PDF template preview">
    <!-- Page background -->
    <rect x="0" y="0" width="240" height="320" fill="#ffffff" stroke="#d9d9d9" stroke-width="1" rx="4" />

    <!-- Compact header: small brand mark left / small title right -->
    <rect x="20" y="18" width="42" height="10" rx="1" fill="#000000" />
    <rect x="20" y="30" width="60" height="3" rx="1" fill="#000000" />
    <rect x="176" y="20" width="46" height="8" rx="0" fill="#000000" />

    <!-- Single thin rule under the header -->
    <line x1="20" y1="42" x2="220" y2="42" stroke="#000000" stroke-width="1" />

    <!-- Dense two-column meta (4 pairs across 2 rows) -->
    <rect x="20" y="52" width="30" height="3" rx="1" fill="#333333" />
    <rect x="60" y="52" width="42" height="3" rx="1" fill="#000000" />
    <rect x="118" y="52" width="30" height="3" rx="1" fill="#333333" />
    <rect x="158" y="52" width="42" height="3" rx="1" fill="#000000" />
    <rect x="20" y="60" width="30" height="3" rx="1" fill="#333333" />
    <rect x="60" y="60" width="42" height="3" rx="1" fill="#000000" />
    <rect x="118" y="60" width="30" height="3" rx="1" fill="#333333" />
    <rect x="158" y="60" width="42" height="3" rx="1" fill="#000000" />

    <!-- Parties, tighter spacing -->
    <rect x="20" y="80" width="20" height="3" rx="1" fill="#000000" />
    <rect x="20" y="88" width="76" height="3" rx="1" fill="#000000" />
    <rect x="20" y="94" width="64" height="3" rx="1" fill="#000000" />
    <rect x="20" y="100" width="50" height="3" rx="1" fill="#000000" />

    <rect x="128" y="80" width="24" height="3" rx="1" fill="#000000" />
    <rect x="128" y="88" width="68" height="3" rx="1" fill="#000000" />
    <rect x="128" y="94" width="54" height="3" rx="1" fill="#000000" />
    <rect x="128" y="100" width="42" height="3" rx="1" fill="#000000" />

    <!-- Items table: thin top+bottom rule on header row -->
    <line x1="20" y1="118" x2="220" y2="118" stroke="#000000" stroke-width="1" />
    <rect x="20" y="122" width="18" height="3" rx="1" fill="#000000" />
    <rect x="112" y="122" width="16" height="3" rx="1" fill="#000000" />
    <rect x="148" y="122" width="16" height="3" rx="1" fill="#000000" />
    <rect x="188" y="122" width="26" height="3" rx="1" fill="#000000" />
    <line x1="20" y1="130" x2="220" y2="130" stroke="#000000" stroke-width="1" />

    <!-- Rows with subtle gray dividers, tight padding -->
    <rect x="20" y="138" width="80" height="3" rx="1" fill="#000000" />
    <rect x="112" y="138" width="22" height="3" rx="1" fill="#000000" />
    <rect x="148" y="138" width="12" height="3" rx="1" fill="#000000" />
    <rect x="188" y="138" width="26" height="3" rx="1" fill="#000000" />
    <line x1="20" y1="146" x2="220" y2="146" stroke="#d9d9d9" stroke-width="1" />
    <rect x="20" y="152" width="72" height="3" rx="1" fill="#000000" />
    <rect x="112" y="152" width="22" height="3" rx="1" fill="#000000" />
    <rect x="148" y="152" width="12" height="3" rx="1" fill="#000000" />
    <rect x="188" y="152" width="26" height="3" rx="1" fill="#000000" />
    <line x1="20" y1="160" x2="220" y2="160" stroke="#d9d9d9" stroke-width="1" />
    <rect x="20" y="166" width="88" height="3" rx="1" fill="#000000" />
    <rect x="112" y="166" width="22" height="3" rx="1" fill="#000000" />
    <rect x="148" y="166" width="12" height="3" rx="1" fill="#000000" />
    <rect x="188" y="166" width="26" height="3" rx="1" fill="#000000" />
    <line x1="20" y1="174" x2="220" y2="174" stroke="#d9d9d9" stroke-width="1" />

    <!-- Right-aligned totals stack (thin dividers, black final total) -->
    <rect x="140" y="186" width="30" height="3" rx="1" fill="#333333" />
    <rect x="192" y="186" width="28" height="3" rx="1" fill="#000000" />
    <rect x="140" y="196" width="24" height="3" rx="1" fill="#333333" />
    <rect x="192" y="196" width="28" height="3" rx="1" fill="#000000" />
    <line x1="138" y1="204" x2="220" y2="204" stroke="#000000" stroke-width="1" />
    <rect x="140" y="210" width="26" height="4" rx="1" fill="#000000" />
    <rect x="192" y="210" width="28" height="4" rx="1" fill="#000000" />

    <!-- Footer note area (thin rule + single-column stacked notes) -->
    <line x1="20" y1="238" x2="220" y2="238" stroke="#000000" stroke-width="1" />
    <rect x="20" y="248" width="34" height="3" rx="1" fill="#000000" />
    <rect x="20" y="256" width="180" height="3" rx="1" fill="#000000" />
    <rect x="20" y="262" width="160" height="3" rx="1" fill="#000000" />
    <rect x="20" y="276" width="28" height="3" rx="1" fill="#000000" />
    <rect x="20" y="284" width="180" height="3" rx="1" fill="#000000" />
    <rect x="20" y="290" width="170" height="3" rx="1" fill="#000000" />
</svg>
